name: Cards de linguagens

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/gen-languages.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.LANGUAGES_TOKEN }}
      - name: Commit se houve mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add languages.svg languages.json cards
          git diff --cached --quiet || git commit -m "chore: atualiza cards de linguagens" && git push
